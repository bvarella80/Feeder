name: Feeder

on:
  schedule:
    # Horários em UTC: 11h = 8h de Brasília, 20h = 17h de Brasília
    - cron: "0 11 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write         # salvar a memória (data/) no repositório
  pages: write            # publicar a página do feed
  id-token: write

concurrency:
  group: feeder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar feeder
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEED_URL: ${{ vars.FEED_URL }}
        run: python feeder.py

      - name: Salvar memória e histórico
        run: |
          git config user.name "feeder-bot"
          git config user.email "feeder-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "feeder: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - name: Publicar página
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
