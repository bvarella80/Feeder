  # Coloque aqui as empresas da sua cobertura: qualquer menção já é relevante.
  empresas:
    label: "Empresas cobertas"
    priority: alta
    keywords:
      - Alupar
      - Taesa
      - ISA Energia
      - Cemig
      - CPFL
      - Copel
      - Equatorial
      - Energisa
      - Light
      - Axia
      - Eletrobras
      - Auren
      - Engie
      - Eneva
      - Sabesp
      - Sanepar
      - Copasa
      - Compass
      - Comgás
      - Orizon
      - Raízen
      - Vibra
      - Ultrapar
      - Ipiranga
