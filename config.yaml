          companies:
            - {ticker: RAIZ4, name: Raízen}
        - name: Vibra (VBBR3)
          companies:
            - {ticker: VBBR3, name: Vibra, aliases: [Vibra Energia]}
        - name: Ultrapar (UGPA3)
          companies:
            - {ticker: UGPA3, name: Ultrapar, aliases: [Ipiranga, Ultragaz]}
        - name: Preços e Petrobras
          terms: [preço do diesel, preço da gasolina, Petrobras reajuste, Petrobras combustíveis, importação de diesel]
          match: [diesel, gasolina, Petrobras, combustível, combustíveis]
        - name: Regulação e tributos
          terms: [ANP combustíveis, ICMS combustíveis, devedor contumaz, mistura de etanol, mistura de biodiesel, Combustível do Futuro]
          match: [ANP, ICMS, contumaz, mistura, biodiesel, Combustível do Futuro, sonegação]

    - name: Bancos LatAm
      groups:
        - name: México
          locale: MX
          companies:
            - {ticker: GFNORTEO, name: Banorte, aliases: [Grupo Financiero Banorte]}
            - {ticker: BBAJIOO, name: BanBajío, aliases: [Banco del Bajío]}
            - {ticker: RA, name: Banregio, aliases: [Regional SAB]}
            - {ticker: GENTERA, name: Gentera, aliases: [Compartamos]}
            - {name: Banamex}
          terms: [Banxico, CNBV]
        - name: Argentina
          locale: AR
          companies:
            - {ticker: GGAL, name: Grupo Galicia, aliases: [Banco Galicia]}
            - {ticker: SUPV, name: Supervielle}
            - {ticker: BMA, name: Banco Macro}
          terms: [BCRA]
        - name: Peru
          locale: PE
