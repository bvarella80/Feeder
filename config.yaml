  sectors:
    # Formato por empresa:  - {ticker: SBSP3, name: Sabesp, aliases: [...]}
    #   name e aliases são buscados no Google Notícias; o ticker também
    #   é reconhecido no título. A etiqueta mostra "Sabesp (SBSP3)".
    # Grupos de tema/contexto usam terms (e match, opcional), como antes.

    - name: Utilities
      groups:
        - name: Transmissão
          companies:
            - {ticker: ALUP11, name: Alupar}
            - {ticker: TAEE11, name: Taesa}
            - {ticker: ISAE4, name: ISA Energia, aliases: [ISA CTEEP]}
        - name: Distribuição e integradas
