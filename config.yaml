      - metas compulsórias
      - metas de descarbonização
      - CBIO
      - RenovaBio
      - Combustível do Futuro
      - devedor contumaz
      - sonegação
      - adulteração
      - mercado irregular
      - fraude fiscal
      - ICMS monofásico
      - ad rem
      - preço do diesel
      - preço da gasolina
      - importação de diesel
      - importação de combustíveis
      - marcador de combustíveis

  leiloes:
    label: "Leilões"
    priority: alta
    keywords:
      - leilão de energia
      - leilão de transmissão
      - leilão de reserva de capacidade
      - LRCAP
