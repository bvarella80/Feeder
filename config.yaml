# Resumo de cada item por IA (opcional; precisa do secret ANTHROPIC_API_KEY)
ai_summary:
  enabled: true
  model: claude-haiku-5-5
  max_items: 40

# Envia e-mail mesmo quando não houver nada novo? (útil para saber que rodou)
send_when_empty: false

# =====================================================================
#  ABA "SETORES" — notícias por setor de cobertura
#
#  Cada setor tem grupos (empresa, tema ou país). Para cada grupo o robô
#  busca no Google Notícias os termos de "terms" nas últimas 24h.
#  - match: (opcional) palavras que precisam aparecer no título; por padrão
#           são os próprios "terms". Útil para temas amplos.
#  - locale: BR (padrão), CL, AR, CO, MX ou PE (busca em espanhol local)
#  Tags exibidas em cada notícia = termos encontrados no título.
#  Termos com inicial maiúscula diferenciam maiúsculas ("Rumo" não casa com
#  "rumo a"); termos em minúsculas valem de qualquer jeito.
# =====================================================================
news:
  max_per_group: 10        # limite de notícias novas por grupo a cada execução
  max_highlight_per_group: 2   # no máximo 2 destaques por grupo a cada execução
  max_highlights_per_run: 5    # e no máximo 5 destaques no total por execução

  # Destaque só vale para notícia destes veículos (ou que cite o ticker no título).
  # Portais locais e agregadores continuam aparecendo, mas sem marcador vermelho.
  highlight_outlets: [Valor, Pipeline, Brazil Journal, NeoFeed, InfoMoney, Estadão, Broadcast, Folha de S.Paulo, O Globo, Exame, Bloomberg, Reuters, Money Times, Seu Dinheiro, Poder360, CNN Brasil, Canal Energia, MegaWhat, epbr, Agência iNFRA, Nova Cana, novaCana, Notícias Agrícolas, Globo Rural, Financial Times, Wall Street Journal, S&P Global, Argus, Barchart, El Financiero, El Economista, Expansión, Diario Financiero, La Tercera, Ámbito, La Nación, Infobae, Portafolio, La República, Gestión, El Comercio]

  # Notícia vira "destaque" (marcador vermelho) se o título tiver um destes termos
