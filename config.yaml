# ---------------------------------------------------------------------
# FONTES
#   type: dou     -> busca no Diário Oficial da União (onde saem REN/REH da ANEEL)
#   type: rss     -> qualquer feed RSS/Atom (inclui Google Notícias)
#   type: html    -> página de notícias/atos: o robô detecta links novos
#
#   require_match: true  -> só entra se casar com algum tema
#                  false -> entra tudo que for novo (exceto 'exclude');
#                           bom para fontes de baixo volume e alta relevância
#   selector: (opcional) seletor CSS para limitar a área de links da página
#   verify_ssl: false  -> use se o site da agência tiver certificado quebrado
# ---------------------------------------------------------------------
sources:

  # ======================= FEDERAL =======================

  # ---------------- MME (e CNPE) ----------------
  - name: "MME — Diário Oficial da União"
    agency: MME
    sector: Energia/Combustíveis
    type: dou
    query: '"Ministério de Minas e Energia"'
    section: do1
    require_match: true

  - name: "CNPE — Diário Oficial da União"
    agency: MME
    sector: Energia/Combustíveis
    type: dou
    query: '"Conselho Nacional de Política Energética"'
    section: do1
    require_match: false

  - name: "MME — Notícias"
    agency: MME
    sector: Energia/Combustíveis
    type: html
    url: https://www.gov.br/mme/pt-br/assuntos/noticias
    require_match: true

  # ---------------- ANEEL ----------------
  - name: "ANEEL — Diário Oficial da União"
    agency: ANEEL
    sector: Energia
    type: dou
    query: '"Agência Nacional de Energia Elétrica"'
    section: do1
    require_match: true

  - name: "ANEEL — Notícias"
    agency: ANEEL
    sector: Energia
    type: html
    url: https://www.gov.br/aneel/pt-br/assuntos/noticias
    require_match: true

  - name: "ANEEL — Na imprensa"
    agency: ANEEL
    sector: Energia
    type: rss
    url: 'https://news.google.com/rss/search?q=ANEEL+(%22revis%C3%A3o+tarif%C3%A1ria%22+OR+reajuste+OR+curtailment+OR+encargo+OR+CDE+OR+metodologia)+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: true

  # ---------------- ONS ----------------
  - name: "ONS — Site"
    agency: ONS
    sector: Energia
    type: html
    url: https://www.ons.org.br/
    require_match: true

  - name: "ONS — Na imprensa"
    agency: ONS
    sector: Energia
    type: rss
    url: 'https://news.google.com/rss/search?q=(%22Operador+Nacional+do+Sistema%22+OR+(ONS+energia)+OR+curtailment+OR+%22corte+de+gera%C3%A7%C3%A3o%22)+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: true

  # ---------------- CCEE ----------------
  - name: "CCEE — Site"
    agency: CCEE
    sector: Energia
    type: html
    url: https://www.ccee.org.br/
    require_match: false

  - name: "CCEE — Na imprensa"
    agency: CCEE
    sector: Energia
    type: rss
    url: 'https://news.google.com/rss/search?q=CCEE+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- ANA (saneamento) ----------------
  - name: "ANA — Diário Oficial da União"
    agency: ANA
    sector: Saneamento
    type: dou
    query: '"Agência Nacional de Águas e Saneamento Básico"'
    section: do1
    require_match: true

  - name: "ANA — Notícias"
    agency: ANA
    sector: Saneamento
    type: html
    url: https://www.gov.br/ana/pt-br/assuntos/noticias-e-eventos/noticias
    require_match: true

  # ---------------- ANP (distribuição de combustíveis) ----------------
  - name: "ANP — Diário Oficial da União"
    agency: ANP
    sector: Combustíveis
    type: dou
    query: '"Agência Nacional do Petróleo, Gás Natural e Biocombustíveis"'
    section: do1
    require_match: true

  - name: "ANP — Notícias"
    agency: ANP
    sector: Combustíveis
    type: html
    url: https://www.gov.br/anp/pt-br/canais_atendimento/imprensa/noticias-comunicados
    require_match: true

  - name: "ANP — Na imprensa"
    agency: ANP
    sector: Combustíveis
    type: rss
    url: 'https://news.google.com/rss/search?q=ANP+(distribuidoras+OR+distribui%C3%A7%C3%A3o+OR+combust%C3%ADveis+OR+mistura+OR+fiscaliza%C3%A7%C3%A3o)+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: true

  # ---------------- ICL (Instituto Combustível Legal) ----------------
  - name: "ICL — Site"
    agency: ICL
    sector: Combustíveis
    type: html
    url: https://institutocombustivellegal.org.br/
    require_match: false

  - name: "ICL — Na imprensa"
    agency: ICL
    sector: Combustíveis
    type: rss
    url: 'https://news.google.com/rss/search?q=%22Instituto+Combust%C3%ADvel+Legal%22+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ======================= ESTADUAL =======================

  # ---------------- Diário Oficial de SP (só elétricas e saneamento) ----------------
  - name: "DOE-SP — Elétricas e saneamento"
    agency: DOE-SP
    sector: Energia/Saneamento
    type: doesp
    days: 2                     # olha os últimos 2 dias a cada execução
    terms:
      - Arsesp
      - Sabesp
      - saneamento básico
      - Universaliza SP
      - energia elétrica
      - concessionária de energia
    require_match: true

  # ---------------- ARSESP (SP) ----------------
  - name: "ARSESP — Site"
    agency: ARSESP
    sector: Saneamento/Gás
    type: html
    url: https://www.arsesp.sp.gov.br/
    require_match: false

  - name: "ARSESP — Na imprensa"
    agency: ARSESP
    sector: Saneamento/Gás
    type: rss
    url: 'https://news.google.com/rss/search?q=Arsesp+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- AGEPAR (PR) ----------------
  - name: "AGEPAR — Notícias"
    agency: AGEPAR
    sector: Saneamento/Gás/Rodovias
    type: html
    url: https://www.agepar.pr.gov.br/Noticias
    require_match: false

  - name: "AGEPAR — Na imprensa"
    agency: AGEPAR
    sector: Saneamento/Gás/Rodovias
    type: rss
    url: 'https://news.google.com/rss/search?q=Agepar+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- ARSAE-MG ----------------
  - name: "ARSAE-MG — Site"
    agency: ARSAE-MG
    sector: Saneamento
    type: html
    url: https://www.arsae.mg.gov.br/
    require_match: false

  - name: "ARSAE-MG — Resoluções"
    agency: ARSAE-MG
    sector: Saneamento
    type: html
    url: https://www.arsae.mg.gov.br/category/resolucoes/
    require_match: false

  - name: "ARSAE-MG — Na imprensa"
    agency: ARSAE-MG
    sector: Saneamento
    type: rss
    url: 'https://news.google.com/rss/search?q=Arsae+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- MODELO para novas agências ----------------
  # Copie, descomente e ajuste a URL da página de notícias/atos:
  #
