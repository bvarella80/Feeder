# =====================================================================
#  FEEDER — configuração (aba Regulatório no início, aba Setores no fim)
#  Edite à vontade: adicionar agência = copiar um bloco em "sources".
# =====================================================================

# ---------------------------------------------------------------------
# TEMAS: o que torna um item relevante. Matching ignora acento e caixa.
# priority: alta | media  (define a ordem no e-mail)
# ---------------------------------------------------------------------
themes:
  revisao_reajuste:
    label: "Revisão / reajuste tarifário"
    priority: alta
    keywords:
      - revisão tarifária
      - revisão tarifária periódica
      - revisão extraordinária
      - RTP
      - reajuste tarifário
      - reajuste anual
      - IRT
      - índice de reajuste
      - processo tarifário
      - ciclo tarifário
      - reposicionamento tarifário
      - estrutura tarifária
      - tarifa de uso
      - TUSD
      - TUST
      - receita anual permitida
      - receita requerida
      - margem de distribuição
      - bandeira tarifária
      - reequilíbrio econômico-financeiro
      - equilíbrio econômico-financeiro

  metodologia:
    label: "Metodologia regulatória"
    priority: alta
    keywords:
      - metodologia
      - PRORET
      - submódulo
      - WACC
      - custo de capital
      - taxa de remuneração
      - fator X
      - base de remuneração
      - BRR
      - BAR
      - custos operacionais regulatórios
      - perdas regulatórias
      - perdas não técnicas
      - componente Pd
      - empresa de referência
      - análise de impacto regulatório

  encargos:
    label: "Encargos e subsídios"
    priority: alta
    keywords:
      - encargo
      - encargos setoriais
      - CDE
      - conta de desenvolvimento energético
      - ESS
      - EER
      - PROINFA
      - TFSEE
      - CCC
      - subsídio
      - conta-covid
      - conta escassez hídrica
      - sobrecontratação

  curtailment:
    label: "Curtailment / restrições de geração"
    priority: alta
    keywords:
      - curtailment
      - corte de geração
      - cortes de geração
      - constrained-off
      - constrained off
      - restrição de operação
      - restrições de operação
      - frustração de geração
      - ressarcimento aos geradores
      - indisponibilidade externa
      - confiabilidade elétrica

  atos_normativos:
