      - deliberação
      - consulta pública
      - audiência pública
      - tomada de subsídios
      - nota técnica
      - agenda regulatória
      - reunião pública
      - resolução CNPE
      - política energética
      - portaria normativa

  saneamento_gas:
    label: "Saneamento e gás (temas setoriais)"
    priority: media
    keywords:
      - marco legal do saneamento
      - universalização
      - capacidade econômico-financeira
      - prestação regionalizada
      - norma de referência
      - ANA
      - tarifa social
      - gás canalizado
      - contrato de concessão
      - aditivo contratual
      - termo aditivo

  combustiveis:
    label: "Distribuição de combustíveis"
    priority: alta
    keywords:
      - distribuição de combustíveis
      - distribuidor de combustíveis
      - distribuidora de combustíveis
      - distribuidoras de combustíveis
      - mistura obrigatória
      - mistura de biodiesel
      - teor de biodiesel
      - percentual obrigatório
