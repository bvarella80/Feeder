      - São Martinho

# Itens com estes termos são descartados (ruído comum em sites de agências)
exclude:
  - concurso público
  - concurso
  - estágio
  - processo seletivo
  - licitação
  - pregão
  - aniversário
  - campanha de vacinação
  - semana do servidor
  - ouvidoria itinerante
  # ruído típico de Diário Oficial
  - extrato de contrato
  - aviso de licitação
  - nomear
  - exonerar
  - aposentadoria
  - pensão
  - diárias
  - férias
  - REIDI
  - projeto prioritário
  - revenda varejista
  - ponto de abastecimento
  - transportador-revendedor-retalhista

# ---------------------------------------------------------------------
# FONTES
#   type: dou     -> busca no Diário Oficial da União (onde saem REN/REH da ANEEL)
#   type: rss     -> qualquer feed RSS/Atom (inclui Google Notícias)
#   type: html    -> página de notícias/atos: o robô detecta links novos
#
#   require_match: true  -> só entra se casar com algum tema
#                  false -> entra tudo que for novo (exceto 'exclude');
#                           bom para fontes de baixo volume e alta relevância
#   selector: (opcional) seletor CSS para limitar a área de links da página
#   verify_ssl: false  -> use se o site da agência tiver certificado quebrado
# ---------------------------------------------------------------------
sources:

  # ======================= FEDERAL =======================

  # ---------------- MME (e CNPE) ----------------
  - name: "MME — Diário Oficial da União"
    agency: MME
    sector: Energia/Combustíveis
    type: dou
    query: '"Ministério de Minas e Energia"'
    section: do1
    require_match: true

  - name: "CNPE — Diário Oficial da União"
    agency: MME
    sector: Energia/Combustíveis
    type: dou
    query: '"Conselho Nacional de Política Energética"'
    section: do1
    require_match: false

  - name: "MME — Notícias"
    agency: MME
    sector: Energia/Combustíveis
    type: html
    url: https://www.gov.br/mme/pt-br/assuntos/noticias
    require_match: true

  # ---------------- ANEEL ----------------
  - name: "ANEEL — Diário Oficial da União"
    agency: ANEEL
    sector: Energia
    type: dou
    query: '"Agência Nacional de Energia Elétrica"'
    section: do1
    require_match: true

  - name: "ANEEL — Notícias"
    agency: ANEEL
    sector: Energia
    type: html
    url: https://www.gov.br/aneel/pt-br/assuntos/noticias
    require_match: true

  - name: "ANEEL — Na imprensa"
    agency: ANEEL
    sector: Energia
    type: rss
    url: 'https://news.google.com/rss/search?q=ANEEL+(%22revis%C3%A3o+tarif%C3%A1ria%22+OR+reajuste+OR+curtailment+OR+encargo+OR+CDE+OR+metodologia)+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: true

  # ---------------- ONS ----------------
  - name: "ONS — Site"
    agency: ONS
    sector: Energia
    type: html
    url: https://www.ons.org.br/
    require_match: true

  - name: "ONS — Na imprensa"
    agency: ONS
    sector: Energia
    type: rss
    url: 'https://news.google.com/rss/search?q=(%22Operador+Nacional+do+Sistema%22+OR+(ONS+energia)+OR+curtailment+OR+%22corte+de+gera%C3%A7%C3%A3o%22)+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: true

  # ---------------- CCEE ----------------
  - name: "CCEE — Site"
    agency: CCEE
    sector: Energia
    type: html
    url: https://www.ccee.org.br/
    require_match: false

  - name: "CCEE — Na imprensa"
    agency: CCEE
    sector: Energia
    type: rss
    url: 'https://news.google.com/rss/search?q=CCEE+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- ANA (saneamento) ----------------
  - name: "ANA — Diário Oficial da União"
    agency: ANA
    sector: Saneamento
    type: dou
    query: '"Agência Nacional de Águas e Saneamento Básico"'
    section: do1
    require_match: true

  - name: "ANA — Notícias"
    agency: ANA
    sector: Saneamento
    type: html
    url: https://www.gov.br/ana/pt-br/assuntos/noticias-e-eventos/noticias
    require_match: true

  # ---------------- ANP (distribuição de combustíveis) ----------------
  - name: "ANP — Diário Oficial da União"
    agency: ANP
    sector: Combustíveis
    type: dou
    query: '"Agência Nacional do Petróleo, Gás Natural e Biocombustíveis"'
    section: do1
    require_match: true

  - name: "ANP — Notícias"
    agency: ANP
    sector: Combustíveis
    type: html
    url: https://www.gov.br/anp/pt-br/canais_atendimento/imprensa/noticias-comunicados
    require_match: true

  - name: "ANP — Na imprensa"
    agency: ANP
    sector: Combustíveis
    type: rss
    url: 'https://news.google.com/rss/search?q=ANP+(distribuidoras+OR+distribui%C3%A7%C3%A3o+OR+combust%C3%ADveis+OR+mistura+OR+fiscaliza%C3%A7%C3%A3o)+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: true

  # ---------------- ICL (Instituto Combustível Legal) ----------------
  - name: "ICL — Site"
    agency: ICL
    sector: Combustíveis
    type: html
    url: https://institutocombustivellegal.org.br/
    require_match: false

  - name: "ICL — Na imprensa"
    agency: ICL
    sector: Combustíveis
    type: rss
    url: 'https://news.google.com/rss/search?q=%22Instituto+Combust%C3%ADvel+Legal%22+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ======================= ESTADUAL =======================

  # ---------------- Diário Oficial de SP (só elétricas e saneamento) ----------------
  - name: "DOE-SP — Elétricas e saneamento"
    agency: DOE-SP
    sector: Energia/Saneamento
    type: doesp
    days: 2                     # olha os últimos 2 dias a cada execução
    terms:
      - Arsesp
      - Sabesp
      - saneamento básico
      - Universaliza SP
      - energia elétrica
      - concessionária de energia
    require_match: true

  # ---------------- ARSESP (SP) ----------------
  - name: "ARSESP — Site"
    agency: ARSESP
    sector: Saneamento/Gás
    type: html
    url: https://www.arsesp.sp.gov.br/
    require_match: false

  - name: "ARSESP — Na imprensa"
    agency: ARSESP
    sector: Saneamento/Gás
    type: rss
    url: 'https://news.google.com/rss/search?q=Arsesp+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- AGEPAR (PR) ----------------
  - name: "AGEPAR — Notícias"
    agency: AGEPAR
    sector: Saneamento/Gás/Rodovias
    type: html
    url: https://www.agepar.pr.gov.br/Noticias
    require_match: false

  - name: "AGEPAR — Na imprensa"
    agency: AGEPAR
    sector: Saneamento/Gás/Rodovias
    type: rss
    url: 'https://news.google.com/rss/search?q=Agepar+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- ARSAE-MG ----------------
  - name: "ARSAE-MG — Site"
    agency: ARSAE-MG
    sector: Saneamento
    type: html
    url: https://www.arsae.mg.gov.br/
    require_match: false

  - name: "ARSAE-MG — Resoluções"
    agency: ARSAE-MG
    sector: Saneamento
    type: html
    url: https://www.arsae.mg.gov.br/category/resolucoes/
    require_match: false

  - name: "ARSAE-MG — Na imprensa"
    agency: ARSAE-MG
    sector: Saneamento
    type: rss
    url: 'https://news.google.com/rss/search?q=Arsae+when:1d&hl=pt-BR&gl=BR&ceid=BR:pt-419'
    require_match: false

  # ---------------- MODELO para novas agências ----------------
  # Copie, descomente e ajuste a URL da página de notícias/atos:
  #
  # - name: "AGERGS — Site"
  #   agency: AGERGS
  #   sector: Saneamento/Gás
  #   type: html
  #   url: https://agergs.rs.gov.br/
  #   require_match: false

# Resumo de cada item por IA (opcional; precisa do secret ANTHROPIC_API_KEY)
ai_summary:
  enabled: true
  model: claude-haiku-5-5
  max_items: 40

# Envia e-mail mesmo quando não houver nada novo? (útil para saber que rodou)
send_when_empty: false

# =====================================================================
#  ABA "SETORES" — notícias por setor de cobertura
#
#  Cada setor tem grupos (empresa, tema ou país). Para cada grupo o robô
#  busca no Google Notícias os termos de "terms" nas últimas 24h.
#  - match: (opcional) palavras que precisam aparecer no título; por padrão
#           são os próprios "terms". Útil para temas amplos.
#  - locale: BR (padrão), CL, AR, CO, MX ou PE (busca em espanhol local)
#  Tags exibidas em cada notícia = termos encontrados no título.
#  Termos com inicial maiúscula diferenciam maiúsculas ("Rumo" não casa com
#  "rumo a"); termos em minúsculas valem de qualquer jeito.
# =====================================================================
news:
  max_per_group: 25        # limite de notícias novas por grupo a cada execução

  # Notícia vira "destaque" (marcador vermelho) se o título tiver um destes termos
  highlight:
    - resultado
    - resultados
    - lucro
    - prejuízo
    - balanço
    - trimestre
    - guidance
    - projeção
    - dividendos
    - JCP
    - juros sobre capital
    - recompra
    - aquisição
    - adquire
    - fusão
    - compra de
    - venda de
    - incorporação
    - IPO
    - follow-on
    - oferta de ações
    - debêntures
    - emissão
    - rating
    - rebaixa
    - eleva nota
    - preço-alvo
    - recomendação
    - CEO
    - novo presidente
    - renúncia
    - recuperação judicial
    - multa
    - CADE
    - investigação
    - Copom
    - Selic
    - reajuste
    - revisão tarifária
    - safra
    - Conab
    - Unica
    - Consecana
    - CBIO
    - mistura
    - ICMS
    - privatização
    - leilão
    # espanhol
    - utilidad
    - ganancias
    - pérdidas
    - adquisición
    - fusión
    - calificación
    - tasa de interés
    - tasa de referencia
    - dividendo
    - director general
    - regulación

  exclude:
    - carteira recomendada
    - ações para investir
    - melhores ações
    - ações para comprar
    - palpite
    - horóscopo
    - loteria
    - mega-sena
    - concurso
    - vagas de emprego
    - futebol
    - patrocínio
    - como abrir conta
    - golpe do pix
    - fútbol

  sectors:
    # Formato por empresa:  - {ticker: SBSP3, name: Sabesp, aliases: [...]}
    #   name e aliases são buscados no Google Notícias; o ticker também
    #   é reconhecido no título. A etiqueta mostra "Sabesp (SBSP3)".
    # Grupos de tema/contexto usam terms (e match, opcional), como antes.

    - name: Utilities
      groups:
        - name: Transmissão
          companies:
            - {ticker: ALUP11, name: Alupar}
            - {ticker: TAEE11, name: Taesa}
            - {ticker: ISAE4, name: ISA Energia, aliases: [ISA CTEEP]}
        - name: Distribuição e integradas
          companies:
            - {ticker: CMIG4, name: Cemig}
            - {ticker: CPFE3, name: CPFL, aliases: [CPFL Energia]}
            - {ticker: CPLE3, name: Copel}
            - {ticker: EQTL3, name: Equatorial}
            - {ticker: ENGI11, name: Energisa}
            - {ticker: LIGT3, name: Light}
        - name: Geração
          companies:
            - {ticker: AXIA3, name: Axia Energia, aliases: [Eletrobras]}
            - {ticker: AURE3, name: Auren, aliases: [Auren Energia]}
            - {ticker: EGIE3, name: Engie Brasil, aliases: [Engie]}
            - {ticker: ENEV3, name: Eneva}
        - name: Saneamento
          companies:
            - {ticker: SBSP3, name: Sabesp}
            - {ticker: SAPR11, name: Sanepar}
            - {ticker: CSMG3, name: Copasa}
        - name: Gás
          companies:
            - {ticker: PASS3, name: Compass, aliases: [Comgás, Compass Gás e Energia]}
        - name: Resíduos
          companies:
            - {ticker: ORVR3, name: Orizon, aliases: [Orizon Valorização]}
        - name: Setor e regulação
          terms: [setor elétrico, leilão de energia, leilão de transmissão, curtailment, conta de luz, marco do saneamento]
          match: [setor elétrico, leilão, curtailment, conta de luz, saneamento, ANEEL, ONS]

    - name: Bancos
      groups:
        - name: Grandes bancos
          companies:
            - {ticker: ITUB4, name: Itaú, aliases: [Itaú Unibanco]}
            - {ticker: BBDC4, name: Bradesco}
            - {ticker: BBAS3, name: Banco do Brasil}
            - {ticker: SANB11, name: Santander Brasil, aliases: [Santander]}
        - name: Médios e investimento
          companies:
            - {ticker: BPAC11, name: BTG Pactual, aliases: [BTG]}
            - {ticker: ABCB4, name: ABC Brasil, aliases: [Banco ABC]}
            - {ticker: BRSR6, name: Banrisul}
            - {ticker: PINE4, name: Banco Pine}
        - name: Digitais
          companies:
            - {ticker: NU, name: Nubank, aliases: [Nu Holdings]}
            - {ticker: INTR, name: Banco Inter, aliases: [Inter&Co]}
            - {ticker: PICS, name: PicPay}
            - {ticker: AGBK, name: Agibank}
        - name: Setor e Banco Central
          terms: [Banco Central crédito, inadimplência, spread bancário, Copom, Febraban]
          match: [Banco Central, BC, inadimplência, spread, Copom, Febraban, crédito]

    - name: Non Banks
      groups:
        - name: Seguros
          companies:
            - {ticker: BBSE3, name: BB Seguridade}
            - {ticker: CXSE3, name: Caixa Seguridade}
            - {ticker: IRBR3, name: IRB, aliases: [IRB Re, IRB(Re)]}
            - {ticker: PSSA3, name: Porto Seguro}
        - name: Mercado de capitais
          companies:
            - {ticker: B3SA3, name: B3}
            - {ticker: XP, name: XP Inc, aliases: [XP Investimentos]}
        - name: Pagamentos
          companies:
            - {ticker: PAGS, name: PagBank, aliases: [PagSeguro]}
            - {ticker: STNE, name: Stone, aliases: [StoneCo]}

    - name: Agro
      groups:
        - name: São Martinho (SMTO3)
          companies:
            - {ticker: SMTO3, name: São Martinho}
        - name: Cosan (CSAN3)
          companies:
            - {ticker: CSAN3, name: Cosan}
        - name: SLC Agrícola (SLCE3)
          companies:
            - {ticker: SLCE3, name: SLC Agrícola, aliases: [SLC]}
        - name: 3tentos (TTEN3)
          companies:
            - {ticker: TTEN3, name: 3tentos, aliases: [Três Tentos]}
        - name: Açúcar e etanol
          terms: [preço do açúcar, etanol, Unica cana, Consecana, safra de cana, CBIO]
          match: [açúcar, etanol, cana, Unica, Consecana, CBIO, ATR]
        - name: Grãos
